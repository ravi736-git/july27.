<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic HTML + JS Demo</title>
  <style>
    /* Basic styling to match the PDF layout */
    :root {
      --accent: #00bcd4;
      --muted: #666;
      --max-width: 800px;
    }
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      color: #111;
      display: flex;
      justify-content: center;
    }
    .page {
      width: 100%;
      max-width: var(--max-width);
    }
    header {
      text-align: center;
      padding: 18px 10px;
      background: linear-gradient(90deg, rgba(0,188,212,0.06), rgba(0,188,212,0.02));
      border-radius: 6px;
      margin-bottom: 18px;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.2px;
    }
    nav {
      text-align: center;
      margin: 12px 0 22px;
      font-size: 0.98rem;
    }
    nav a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 8px;
    }
    main {
      margin: 0 0 28px;
    }
    section {
      margin-bottom: 20px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.45;
    }
    #home .btn {
      display: inline-block;
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    #output {
      margin-top: 12px;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 4px;
      color: #222;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 12px 0;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="page" role="document">
    <!-- Semantic header -->
    <header role="banner">
      <h1>Welcome to My Page</h1>
    </header>

    <!-- Navigation -->
    <nav role="navigation" aria-label="Main navigation">
      <a href="#home">Home</a> |
      <a href="#about">About</a>
    </nav>

    <!-- Main content -->
    <main role="main">
      <!-- Home section -->
      <section id="home" aria-labelledby="home-heading">
        <h2 id="home-heading">Home Section</h2>
        <p id="home-text">This paragraph will be updated by JavaScript.</p>
        <button class="btn" id="clickBtn" type="button">Click Me</button>

        <!-- Area where JS will write output -->
        <div id="output" aria-live="polite"></div>
      </section>

      <!-- About section -->
      <section id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">About Section</h2>
        <p>
          This is the about section. You can replace this text with information
          about the page or author.
        </p>
      </section>
    </main>

    <!-- Footer -->
    <footer role="contentinfo">
       2026 Demo Page
    </footer>
  </div>

  <script>
    // script.js content from the PDF, adapted and fixed
    console.log("Page loaded successfully");

    function runJS() {
      // Insert heading and paragraph into #output using safe DOM methods
      const output = document.getElementById("output");
      // Clear previous content
      output.innerHTML = "";

      const h3 = document.createElement("h3");
      h3.textContent = "Hello from innerHTML!";
      output.appendChild(h3);

     
      console.log("Button was clicked at: " + new Date().toLocaleTimeString());

      const p = document.createElement("p");
      p.textContent = "This line came from JavaScript.";
      output.appendChild(p);
    }
    document.getElementById("clickBtn").addEventListener("click",runJS);
    </script>
    </body>
    </html>
